<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=Instrument+Serif:ital@0;1&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Hanken Grotesk",sans-serif;color:#ECEFF4;
  background:
    radial-gradient(120% 90% at 50% 125%, rgba(255,122,43,.30) 0%, rgba(255,122,43,0) 52%),
    radial-gradient(70% 50% at 88% -5%, rgba(70,120,160,.14), transparent 60%),
    #0B0E12;
  padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.brand svg{width:48px;height:48px}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:96px;line-height:1.0;letter-spacing:-.02em;margin-top:auto}
h1 em{font-style:italic;color:#FFD09A}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}
.sub{font-size:25px;color:#9AA7B5;max-width:20em}
.eyebrow{font-family:"Spline Sans Mono",monospace;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#FFB55C}
.pill{font-family:"Spline Sans Mono",monospace;font-size:18px;color:#0B0E12;background:linear-gradient(180deg,#FFB55C,#F2792B);padding:12px 22px;border-radius:999px;font-weight:600}
</style></head><body>
  <div class="brand">
    <svg viewBox="0 0 64 64"><defs><linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="1" stop-color="#FF9A3D"/></linearGradient></defs>
    <path d="M7 35c6.5 10 16 14.5 25 14.5S50.5 45 57 35" fill="none" stroke="#D8631C" stroke-width="3.2" stroke-linecap="round"/><path d="M13 31c4.5 6.7 11.5 10 19 10s14.5-3.3 19-10" fill="none" stroke="#FF9A3D" stroke-width="3.2" stroke-linecap="round"/><ellipse cx="24" cy="30" rx="3.6" ry="4.5" fill="url(#e)"/><ellipse cx="32" cy="28" rx="3.6" ry="4.5" fill="#FFE7C6"/><ellipse cx="40" cy="30" rx="3.6" ry="4.5" fill="url(#e)"/></svg>
    Nestral
  </div>
  <div class="eyebrow">Your AI chief-of-staff</div>
  <h1>Everything you run,<br>in <em>one nest.</em></h1>
  <div class="row">
    <div class="sub">One morning brief across everything you run — ranked by what needs you today.</div>
    <div class="pill">nestral.ai</div>
  </div>
</body></html>
